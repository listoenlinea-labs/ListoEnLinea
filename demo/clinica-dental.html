<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#263d49">
  <title>Demo clínica dental | Listo En Línea</title>
  <meta name="description" content="Demo público y navegable de una plataforma integral para clínica dental desarrollada por Listo En Línea.">
  <link rel="stylesheet" href="clinica-dental.css?v=20261001">
</head>
<body>
  <div class="demo-ribbon">
    <strong>Demo público</strong>
    <span>Clínica dental · datos ficticios · sin login · sin conexión a base de datos</span>
    <a href="../index.html#portfolio">Volver a Listo En Línea</a>
  </div>

  <header class="clinic-header">
    <button class="brand" type="button" data-page="home" aria-label="Ir al inicio">
      <span class="brand-logo"><img src="../assets/img/projects/samantha-studio-lab.svg" alt=""></span>
      <span><b>samantha's studio lab</b><small>ODONTOPEDIATRÍA · DEMO</small></span>
    </button>

    <nav class="main-nav" aria-label="Navegación del demo">
      <button type="button" data-page="home">Inicio</button>
      <button type="button" data-page="agenda">Agenda</button>
      <button type="button" data-page="patients">Pacientes</button>
      <details class="nav-menu">
        <summary>Clínica <span>⌄</span></summary>
        <div>
          <button type="button" data-page="operation">Jornada clínica</button>
          <button type="button" data-page="treatments">Tratamientos</button>
          <button type="button" data-page="followups">Seguimientos</button>
          <button type="button" data-page="rx">Rayos X</button>
          <button type="button" data-page="inventory">Inventario</button>
        </div>
      </details>
      <details class="nav-menu">
        <summary>Administración <span>⌄</span></summary>
        <div>
          <button type="button" data-page="finance">Finanzas y CxC</button>
          <button type="button" data-page="reports">Reportes</button>
          <button type="button" data-page="config">Configuración</button>
        </div>
      </details>
    </nav>

    <div class="header-actions">
      <button class="header-action" type="button" data-global-search>⌕ Buscar</button>
      <button class="header-action primary" type="button" data-global-create>＋ Crear</button>
      <span class="role-chip">Administrador</span>
    </div>
  </header>

  <main id="demoApp" class="demo-app" aria-live="polite"></main>

  <div id="demoModal" class="modal-backdrop" hidden aria-hidden="true"></div>
  <div id="demoToast" class="toast" role="status" aria-live="polite"></div>

  <script src="clinica-dental.js?v=20261001"></script>
</body>
</html>
