name: Validate public demos
on:
  push:
    branches:
      - feat/demos-fieles-ficticios-yerena-mision-20261026
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/demo-validation.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 > /tmp/demo-http.log 2>&1 &
      - run: node demo/tests/smoke.cjs
      - run: node demo/tests/mobile.cjs
